name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land against code that has not changed, so re-scan weekly
    # rather than only on a push.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Findings are written to the repository's Security tab.
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: javascript-typescript
          queries: security-extended

      # The site is Astro and TypeScript, which CodeQL analyses from source, so
      # there is no build step to run here.
      - name: Analyse
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
