name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # Playwright builds the site and serves it with wrangler dev itself, so
      # what the browser sees here is the production build behind the real
      # headers layer.
      - run: npm test

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans the commit history, not just the tip, so a secret
          # that was committed and later removed still gets caught.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Everything here is a devDependency of a static build, so a low-severity
      # advisory is noise. Fail the build on high and critical only.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  deploy:
    name: Deploy
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A pull request goes to its own preview version, which gets its own
          # URL and is never promoted to the apex. Only main deploys the site.
          command: >-
            ${{ github.event_name == 'pull_request'
                && format('versions upload --message "PR #{0}: {1}"', github.event.number, github.sha)
                || 'deploy' }}

      - name: Comment the preview URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        with:
          script: |
            const match = /https:\/\/\S+\.workers\.dev/.exec(process.env.DEPLOY_OUTPUT || '');
            if (!match) return;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview: ${match[0]}\n\nEvery hostname that is not the apex serves \`X-Robots-Tag: noindex\`, so this copy will not be indexed.`
            });
