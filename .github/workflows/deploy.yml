name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # Playwright builds the site and serves it with wrangler dev itself, so
      # what the browser sees here is the production build behind the real
      # headers layer.
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A pull request goes to its own preview version, which gets its own
          # URL and is never promoted to the apex. Only main deploys the site.
          command: >-
            ${{ github.event_name == 'pull_request'
                && format('versions upload --message "PR #{0}: {1}"', github.event.number, github.sha)
                || 'deploy' }}

      - name: Comment the preview URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        with:
          script: |
            const match = /https:\/\/\S+\.workers\.dev/.exec(process.env.DEPLOY_OUTPUT || '');
            if (!match) return;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview: ${match[0]}\n\nEvery hostname that is not the apex serves \`X-Robots-Tag: noindex\`, so this copy will not be indexed.`
            });
