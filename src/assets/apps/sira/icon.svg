<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sira-background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1B5540" />
      <stop offset="1" stop-color="#0F3427" />
    </linearGradient>
    <radialGradient id="sira-vignette" cx="26%" cy="12%" r="90%">
      <stop stop-color="#fff" stop-opacity=".14" />
      <stop offset=".69" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <filter id="sira-card-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dy="12" stdDeviation="15" flood-opacity=".28" />
    </filter>
    <filter id="sira-tile-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dy="14" stdDeviation="17" flood-opacity=".3" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#sira-background)" />
  <rect width="512" height="512" rx="114" fill="url(#sira-vignette)" />

  <g transform="translate(106 106)">
    <g transform="rotate(-14 88 139)" filter="url(#sira-card-shadow)">
      <rect x="22" y="44" width="132" height="190" rx="20" fill="#FBF8F0" />
      <rect x="60" y="111" width="56" height="56" rx="9" fill="#C2452F" transform="rotate(45 88 139)" />
    </g>
    <g transform="rotate(9 210 127)" filter="url(#sira-tile-shadow)">
      <rect x="144" y="32" width="132" height="190" rx="18" fill="#EFE4C9" />
      <text x="210" y="139" fill="#123A2C" font-family="'JetBrains Mono', monospace" font-size="76" font-weight="600" text-anchor="middle">7</text>
      <circle cx="210" cy="175" r="10" fill="#C2452F" />
    </g>
  </g>
</svg>
